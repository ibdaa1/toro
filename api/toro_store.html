<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO — عطور فاخرة</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#c9a84c;--g2:#e8d5a3;--d:#080808;--d2:#111;--d3:#1c1c1c;--d4:#252525;
  --tx:#f5f0e8;--mu:#7a7568;--re:#d94f4f;--gr:#4caf7d;--bl:#5b9bd5;
  --wa:#25D366;--r:12px;--or:#e8943a
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--d);color:var(--tx);font-family:'Tajawal',sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--g);border-radius:2px}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img{display:block;max-width:100%}

/* ═══ HEADER ═══ */
.hdr{position:fixed;top:0;width:100%;z-index:300;height:58px;background:rgba(8,8,8,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,.15);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:7px;color:var(--g);font-style:italic}
.hdr-r{display:flex;gap:8px;align-items:center}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,168,76,.25);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s;position:relative}
.ico:hover{border-color:var(--g)}
.bdg{position:absolute;top:-3px;right:-3px;background:var(--g);color:var(--d);font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center}
.lbtn{padding:5px 12px;border-radius:20px;border:1px solid rgba(201,168,76,.3);color:var(--g);font-size:12px;letter-spacing:1px;transition:.2s}
.lbtn:hover{background:var(--g);color:var(--d)}

/* ═══ BOTTOM NAV ═══ */
.bnav{position:fixed;bottom:0;width:100%;z-index:300;background:rgba(8,8,8,.97);border-top:1px solid rgba(201,168,76,.12);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;color:var(--mu);font-size:10px;transition:.2s}
.bni.on{color:var(--g)}
.bni svg{width:20px;height:20px}

/* ═══ PAGES ═══ */
.pg{display:none;padding:66px 0 70px;min-height:100vh;animation:fu .3s ease}
.pg.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ HERO ═══ */
.hero{padding:32px 16px 24px;text-align:center;background:radial-gradient(ellipse at center,rgba(201,168,76,.07) 0%,transparent 70%)}
.h-eye{font-size:10px;letter-spacing:5px;color:var(--g);text-transform:uppercase;margin-bottom:8px;opacity:.8}
.h-tit{font-family:'Playfair Display',serif;font-size:46px;letter-spacing:8px;color:var(--g);font-style:italic;line-height:1;margin-bottom:4px}
.h-sub{font-size:11px;color:var(--mu);letter-spacing:3px;text-transform:uppercase}

/* ═══ SEARCH ═══ */
.sw{padding:14px 14px 10px;position:relative}
.sw input{width:100%;background:var(--d2);border:1px solid rgba(201,168,76,.18);border-radius:28px;padding:11px 44px;color:var(--tx);font-size:14px;outline:none;transition:.25s}
.sw input:focus{border-color:var(--g);background:var(--d3)}
.sic{position:absolute;top:50%;transform:translateY(-50%);font-size:15px;color:var(--mu)}
[dir=rtl] .sic{right:28px}[dir=ltr] .sic{left:28px}

/* ═══ FILTERS ═══ */
.flts{display:flex;gap:7px;padding:0 14px 16px;overflow-x:auto;scrollbar-width:none}
.flts::-webkit-scrollbar{display:none}
.flt{white-space:nowrap;padding:6px 15px;border-radius:18px;border:1px solid rgba(201,168,76,.2);color:var(--mu);font-size:13px;transition:.2s;flex-shrink:0}
.flt.on,.flt:hover{background:var(--g);color:var(--d);border-color:var(--g);font-weight:600}

/* ═══ PRODUCT GRID ═══ */
.pgrd{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px}
@media(min-width:560px){.pgrd{grid-template-columns:repeat(3,1fr)}}
@media(min-width:850px){.pgrd{grid-template-columns:repeat(4,1fr)}}

/* ═══ PRODUCT CARD ═══ */
.pc{background:var(--d2);border-radius:var(--r);border:1px solid rgba(201,168,76,.08);overflow:hidden;cursor:pointer;transition:transform .28s,border-color .28s,box-shadow .28s;animation:ci .4s ease both}
.pc:hover{transform:translateY(-4px);border-color:rgba(201,168,76,.4);box-shadow:0 12px 36px rgba(0,0,0,.6)}
@keyframes ci{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pc:nth-child(1){animation-delay:.04s}.pc:nth-child(2){animation-delay:.08s}.pc:nth-child(3){animation-delay:.12s}
.pc:nth-child(4){animation-delay:.16s}.pc:nth-child(5){animation-delay:.20s}.pc:nth-child(6){animation-delay:.24s}
.pim{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--d3),var(--d4))}
.pim img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.25,.46,.45,.94)}
.pc:hover .pim img{transform:scale(1.09)}
.pfb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:50px}
.dbd{position:absolute;top:8px;background:var(--re);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:16px;z-index:2}
[dir=rtl] .dbd{right:8px}[dir=ltr] .dbd{left:8px}
.sbd{position:absolute;top:8px;background:rgba(0,0,0,.7);color:var(--mu);font-size:10px;padding:2px 7px;border-radius:8px;z-index:2}
[dir=rtl] .sbd{left:8px}[dir=ltr] .sbd{right:8px}
.prb{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:22px 10px 9px;transform:translateY(100%);transition:.28s;z-index:2}
.pc:hover .prb{transform:translateY(0)}
.prb-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.prb-now{font-size:17px;font-weight:800;color:var(--g)}
.prb-was{font-size:11px;color:rgba(255,255,255,.45);text-decoration:line-through}
.prb-d{font-size:10px;background:var(--re);color:#fff;padding:2px 6px;border-radius:6px;font-weight:700}
.pinf{padding:10px}
.pbr{font-size:10px;color:var(--g);font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.pnm{font-size:13px;font-weight:500;margin:3px 0 7px;line-height:1.3}
.prc{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pnow{font-size:17px;font-weight:800;color:var(--g)}
.pwas{font-size:11px;color:var(--mu);text-decoration:line-through}
.pcur{font-size:10px;color:var(--mu)}
.pdsc{font-size:10px;background:rgba(217,79,79,.15);color:var(--re);padding:2px 6px;border-radius:6px;font-weight:700}
.cbts{display:flex;gap:6px;margin-top:2px}
.cadd{flex:1;padding:8px 6px;border:1px solid rgba(201,168,76,.3);color:var(--tx);border-radius:8px;font-size:12px;transition:.2s;position:relative;overflow:hidden}
.cadd::after{content:'';position:absolute;inset:0;background:var(--g);transform:scaleX(0);transform-origin:left;transition:.25s;z-index:0}
.cadd:hover::after{transform:scaleX(1)}
.cadd span{position:relative;z-index:1;transition:color .25s}
.cadd:hover span{color:var(--d);font-weight:700}
.cwa{width:36px;height:36px;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;flex-shrink:0}
.cwa:hover{background:var(--wa);border-color:var(--wa)}

/* ═══ PAGE TITLE ═══ */
.ptit{font-family:'Playfair Display',serif;font-size:22px;color:var(--g);padding:22px 16px 14px;font-style:italic;letter-spacing:2px}

/* ═══ CART ═══ */
.citem{background:var(--d2);border-radius:var(--r);padding:13px;margin:0 12px 9px;display:flex;gap:11px;align-items:center;border:1px solid rgba(201,168,76,.08);animation:fu .3s ease}
.cimg{width:60px;height:60px;border-radius:9px;overflow:hidden;flex-shrink:0;background:var(--d3);display:flex;align-items:center;justify-content:center;font-size:26px}
.cimg img{width:100%;height:100%;object-fit:cover}
.cinf{flex:1;min-width:0}
.cnm{font-size:13px;font-weight:500}
.cpr{font-size:12px;color:var(--g);margin-top:2px}
.qr{display:flex;align-items:center;gap:8px;margin-top:7px}
.qb{width:26px;height:26px;border-radius:50%;border:1px solid rgba(201,168,76,.3);display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s}
.qb:hover{background:var(--g);color:var(--d);border-color:var(--g)}
.qv{font-size:14px;font-weight:700;min-width:18px;text-align:center}
.rmb{color:var(--re);font-size:17px;padding:4px;opacity:.7;transition:.2s}
.rmb:hover{opacity:1}
.csm{margin:12px;background:var(--d2);border-radius:var(--r);padding:18px;border:1px solid rgba(201,168,76,.12)}
.sr{display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px;color:var(--mu)}
.sr.tot{font-size:17px;font-weight:800;color:var(--g);border-top:1px solid rgba(201,168,76,.15);padding-top:11px;margin-top:4px;margin-bottom:0}
.cart-btns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.btn-g{padding:14px;background:var(--g);color:var(--d);border-radius:var(--r);font-size:14px;font-weight:800;transition:.2s;letter-spacing:.3px}
.btn-g:hover{opacity:.85}
.btn-g:disabled{opacity:.35;cursor:not-allowed}
.btn-wa{padding:14px 18px;background:var(--wa);color:#fff;border-radius:var(--r);font-size:20px;transition:.2s;display:flex;align-items:center;justify-content:center}
.btn-wa:hover{opacity:.85}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.ei{font-size:56px;margin-bottom:14px;opacity:.6}

/* ═══ CHECKOUT ═══ */
.chkf{padding:0 14px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;letter-spacing:.4px}
.fi,.fta{width:100%;background:var(--d2);border:1px solid rgba(201,168,76,.18);border-radius:var(--r);padding:12px 14px;color:var(--tx);font-size:14px;outline:none;transition:.2s}
.fi:focus,.fta:focus{border-color:var(--g);background:var(--d3)}
.fta{min-height:76px;resize:vertical}
.fsel{width:100%;background:var(--d3);border:1px solid rgba(201,168,76,.18);border-radius:var(--r);padding:11px 14px;color:var(--tx);font-size:14px;outline:none;appearance:none}
.fsel:focus{border-color:var(--g)}
.chk-acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
.chk-wa{padding:15px 20px;background:var(--wa);color:#fff;border-radius:var(--r);display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;font-weight:700}

/* ═══ ORDERS ═══ */
.oc{background:var(--d2);border-radius:var(--r);padding:14px;margin:0 12px 10px;border:1px solid rgba(201,168,76,.08);animation:fu .3s ease}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.oid{font-size:11px;color:var(--mu)}
.ost{font-size:10px;font-weight:800;padding:3px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px}
.sp{background:rgba(201,168,76,.12);color:var(--g)}.sc2{background:rgba(76,175,125,.12);color:var(--gr)}
.ss{background:rgba(91,155,213,.12);color:var(--bl)}.sd{background:rgba(76,175,125,.18);color:var(--gr)}
.sx{background:rgba(217,79,79,.12);color:var(--re)}
.oit{font-size:12px;color:var(--mu);margin-bottom:9px;line-height:1.7}
.otot{font-size:15px;font-weight:800;color:var(--g)}

/* ═══ AUTH / PROFILE ═══ */
.aw{max-width:420px;margin:16px auto;padding:0 14px}
.ac{background:var(--d2);border-radius:18px;padding:28px 22px;border:1px solid rgba(201,168,76,.15)}
.alo{text-align:center;margin-bottom:20px}
.alt{font-family:'Playfair Display',serif;font-size:38px;color:var(--g);letter-spacing:8px;font-style:italic}
.atbs{display:flex;margin-bottom:20px;border-bottom:1px solid rgba(201,168,76,.12)}
.atb2{flex:1;padding:11px;text-align:center;color:var(--mu);font-size:14px;border-bottom:2px solid transparent;transition:.2s}
.atb2.on{color:var(--g);border-bottom-color:var(--g)}
.pw{max-width:420px;margin:16px auto;padding:0 14px}
.pi{background:var(--d2);border-radius:18px;padding:28px 22px;text-align:center;border:1px solid rgba(201,168,76,.15)}
.pav{width:76px;height:76px;border-radius:50%;background:var(--g);color:var(--d);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:3px solid rgba(201,168,76,.25)}
.pnm2{font-size:19px;font-weight:700;margin-bottom:3px}.pem{font-size:12px;color:var(--mu);margin-bottom:20px}
.bol{padding:10px 22px;border:1px solid var(--g);color:var(--g);border-radius:var(--r);font-size:13px;transition:.2s;margin:3px;display:inline-block}
.bol:hover{background:var(--g);color:var(--d)}
.bdr{padding:10px 22px;border:1px solid var(--re);color:var(--re);border-radius:var(--r);font-size:13px;transition:.2s;margin:3px;display:inline-block}
.bdr:hover{background:var(--re);color:#fff}

/* ════════════════════════════════════════
   ADMIN DASHBOARD - FULL
════════════════════════════════════════ */
.adm-wrap{padding:0 14px}

/* Stats Grid */
.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:580px){.adm-stats{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--d2);border-radius:var(--r);padding:18px 14px;border:1px solid rgba(201,168,76,.1);position:relative;overflow:hidden;transition:.2s}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--g)}
.stat-card:hover{border-color:rgba(201,168,76,.3);transform:translateY(-2px)}
.stat-icon{font-size:28px;margin-bottom:8px}
.stat-val{font-size:26px;font-weight:800;color:var(--g);line-height:1}
.stat-lbl{font-size:11px;color:var(--mu);margin-top:4px}
.stat-card.blue::before{background:var(--bl)}
.stat-card.blue .stat-val{color:var(--bl)}
.stat-card.green::before{background:var(--gr)}
.stat-card.green .stat-val{color:var(--gr)}
.stat-card.orange::before{background:var(--or)}
.stat-card.orange .stat-val{color:var(--or)}

/* Admin Tabs */
.adm-tabs{display:flex;gap:0;margin-bottom:20px;background:var(--d2);border-radius:var(--r);padding:4px;border:1px solid rgba(201,168,76,.1);overflow-x:auto;scrollbar-width:none}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex:1;padding:9px 14px;border-radius:9px;color:var(--mu);font-size:13px;transition:.2s;white-space:nowrap;text-align:center}
.adm-tab.on{background:var(--g);color:var(--d);font-weight:700}

/* Table Wrapper */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid rgba(201,168,76,.1)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--d3);color:var(--g);padding:12px 13px;font-weight:700;white-space:nowrap}
[dir=rtl] th{text-align:right}[dir=ltr] th{text-align:left}
td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--mu);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,.025)}

/* Action Buttons */
.act-row{display:flex;gap:7px;align-items:center}
.btn-sm{padding:5px 11px;border-radius:7px;font-size:12px;border:1px solid;transition:.2s;white-space:nowrap}
.btn-edit{color:var(--g);border-color:rgba(201,168,76,.3)}.btn-edit:hover{background:var(--g);color:var(--d)}
.btn-del{color:var(--re);border-color:rgba(217,79,79,.3)}.btn-del:hover{background:var(--re);color:#fff}
.btn-view{color:var(--bl);border-color:rgba(91,155,213,.3)}.btn-view:hover{background:var(--bl);color:#fff}
.btn-wa-sm{color:var(--wa);border-color:rgba(37,211,102,.3);padding:5px 9px}.btn-wa-sm:hover{background:var(--wa);color:#fff}

/* Add button */
.btn-add{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;background:var(--g);color:var(--d);border-radius:var(--r);font-size:13px;font-weight:800;margin-bottom:14px;transition:.2s}
.btn-add:hover{opacity:.85}

/* Status selector */
.st-sel{background:var(--d3);color:var(--tx);border:1px solid rgba(201,168,76,.2);border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.st-sel:focus{border-color:var(--g)}

/* Prod thumb */
.prod-thumb{width:40px;height:40px;border-radius:7px;overflow:hidden;background:var(--d3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prod-thumb img{width:100%;height:100%;object-fit:cover}

/* Status badges */
.ost{font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

/* Search in admin */
.adm-search{position:relative;margin-bottom:14px}
.adm-search input{width:100%;background:var(--d2);border:1px solid rgba(201,168,76,.18);border-radius:28px;padding:10px 42px;color:var(--tx);font-size:13px;outline:none;transition:.25s}
.adm-search input:focus{border-color:var(--g)}
.adm-search .sic{position:absolute;top:50%;transform:translateY(-50%);font-size:14px;color:var(--mu)}
[dir=rtl] .adm-search .sic{right:15px}[dir=ltr] .adm-search .sic{left:15px}

/* Order detail expand */
.ord-items{font-size:11px;color:var(--mu);line-height:1.8}

/* Active/Inactive badge */
.badge-on{background:rgba(76,175,125,.12);color:var(--gr);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.badge-off{background:rgba(217,79,79,.1);color:var(--re);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}

/* Category badge */
.cat-m{background:rgba(91,155,213,.1);color:var(--bl);font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
.cat-w{background:rgba(217,79,79,.1);color:#e886a0;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
.cat-u{background:rgba(201,168,76,.1);color:var(--g);font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}

/* Empty admin */
.adm-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.adm-empty .ei{font-size:48px;margin-bottom:12px;opacity:.5}

/* Revenue chart */
.rev-bar{height:6px;background:rgba(201,168,76,.15);border-radius:3px;overflow:hidden;margin-top:6px}
.rev-fill{height:100%;background:var(--g);border-radius:3px;transition:width .8s ease}

/* ═══ MODAL ═══ */
.ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.ov.open{display:flex}
.modal{background:var(--d2);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border:1px solid rgba(201,168,76,.18);animation:mIn .3s cubic-bezier(.34,1.3,.64,1)}
@keyframes mIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.mt{font-size:17px;font-weight:700;color:var(--g);margin-bottom:18px;font-family:'Playfair Display',serif}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ipr{width:100%;height:110px;background:var(--d3);border-radius:var(--r);border:1px dashed rgba(201,168,76,.3);display:flex;align-items:center;justify-content:center;margin-top:7px;overflow:hidden;font-size:12px;color:var(--mu)}
.ipr img{width:100%;height:100%;object-fit:cover}

/* Product Detail Modal */
.pdim{width:100%;aspect-ratio:1;max-height:240px;border-radius:12px;overflow:hidden;background:var(--d3);display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:16px}
.pdim img{width:100%;height:100%;object-fit:cover}
.pdbr{font-size:10px;color:var(--g);text-transform:uppercase;letter-spacing:2px}
.pdnm{font-size:20px;font-weight:700;margin:5px 0 4px}
.pdmt{font-size:11px;color:var(--mu);margin-bottom:11px}

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const BASE   = 'https://qooqz.infinityfreeapp.com/api';
const WA_NUM = '971559740334';

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const LS = { USER:'toro_user', TOKEN:'toro_token', CART:'toro_cart', LANG:'toro_lang' };

let lang   = localStorage.getItem(LS.LANG) || 'ar';
let prods  = [];
let curFlt = 'all';
let curPg  = 'home';
let modalProdId = null;
let modalQty    = 1;
let admCurrentTab = 'products';
let admSearchQ  = '';

// Apply saved lang immediately
applyLang();

// ══════════════════════════════════════════
// TRANSLATIONS
// ══════════════════════════════════════════
const TR = {
  eye:   {ar:'عطور فاخرة أصيلة',       en:'Authentic Luxury Fragrances'},
  sub:   {ar:'الإمارات العربية المتحدة', en:'United Arab Emirates'},
  sph:   {ar:'ابحث عن عطر أو ماركة...', en:'Search perfumes or brands...'},
  ct:    {ar:'🛒 السلة',en:'🛒 Cart'},
  cht:   {ar:'💳 إتمام الطلب',en:'💳 Checkout'},
  ot:    {ar:'📦 طلباتي',en:'📦 My Orders'},
  al:    {ar:'العنوان التفصيلي',en:'Delivery Address'},
  nl:    {ar:'ملاحظات',en:'Notes'},
  pl:    {ar:'تأكيد الطلب',en:'Place Order'},
  ac:    {ar:'أضف للسلة',en:'Add to Cart'},
  ec:    {ar:'السلة فارغة',en:'Cart is empty'},
  no:    {ar:'لا توجد طلبات',en:'No orders yet'},
  sb:    {ar:'المجموع',en:'Subtotal'},
  sh:    {ar:'الشحن',en:'Shipping'},
  fr:    {ar:'مجاني',en:'Free'},
  tot:   {ar:'الإجمالي',en:'Total'},
  aed:   {ar:'د.إ',en:'AED'},
  sv:    {ar:'وفّر',en:'Save'},
  ori:   {ar:'الأصل',en:'Origin'},
  stk:   {ar:'متبقي',en:'Left'},
  sw:    {ar:'حفظ المنتج',en:'Save Product'},
  dsh:   {ar:'لوحة التحكم',en:'Dashboard'},
  aok:   {ar:'✓ أضيف للسلة',en:'✓ Added to cart'},
  ook:   {ar:'✓ تم تقديم طلبك!',en:'✓ Order placed!'},
  lr:    {ar:'سجّل دخولك أولاً',en:'Please login first'},
  qty:   {ar:'الكمية',en:'Quantity'},
  chknote:{ar:'يمكنك إتمام الطلب عبر الموقع أو إرساله مباشرة على واتساب',en:'Complete your order online or send via WhatsApp'},
  wabtn: {ar:'واتساب',en:'WhatsApp'},
  status:{
    pending:   {ar:'قيد الانتظار',en:'Pending'},
    confirmed: {ar:'مؤكد',en:'Confirmed'},
    shipped:   {ar:'تم الشحن',en:'Shipped'},
    delivered: {ar:'تم التوصيل',en:'Delivered'},
    cancelled: {ar:'ملغي',en:'Cancelled'}
  }
};
const t  = k => TR[k]?.[lang] || k;
const ts = s => TR.status[s]?.[lang] || s;

// ══════════════════════════════════════════
// LANGUAGE
// ══════════════════════════════════════════
function applyLang() {
  document.body.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('dir', lang==='ar'?'rtl':'ltr');
  document.documentElement.setAttribute('lang', lang);
  const btn = document.getElementById('lbtn');
  if (btn) btn.textContent = lang==='ar'?'EN':'AR';
}

function swLang() {
  lang = lang==='ar' ? 'en' : 'ar';
  localStorage.setItem(LS.LANG, lang);
  applyLang();
  document.querySelectorAll('[data-ar]').forEach(el => el.textContent = el.getAttribute('data-'+lang));
  const ids = {
    't-eye':t('eye'),'t-sub':t('sub'),'t-cart':t('ct'),'t-chk':t('cht'),
    't-ord':t('ot'),'t-addr':t('al'),'t-notes':t('nl'),'t-place':t('pl'),
    't-save':t('sw'),'t-dash':t('dsh'),'t-qty':t('qty'),
    't-chk-note':t('chknote'),'t-wa-send':t('wabtn')
  };
  Object.entries(ids).forEach(([id,val])=>{const el=document.getElementById(id);if(el)el.textContent=val;});
  const si = document.getElementById('srchIn');
  if (si) si.placeholder = t('sph');
  renderPage();
}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function nav(pg) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.bni').forEach(b => b.classList.remove('on'));
  document.getElementById('pg-'+pg)?.classList.add('on');
  document.getElementById('bn-'+pg)?.classList.add('on');
  curPg = pg;
  renderPage();
  window.scrollTo(0,0);
}
function renderPage() {
  if (curPg==='home')     renderProds();
  if (curPg==='cart')     renderCart();
  if (curPg==='orders')   renderOrders();
  if (curPg==='profile')  renderProfile();
  if (curPg==='checkout') renderChkSumm();
  if (curPg==='admin')    initAdmin();
}

// ══════════════════════════════════════════
// API HELPER — FIXED TOKEN HANDLING
// ══════════════════════════════════════════
async function api(method, url, body=null) {
  const tk = localStorage.getItem(LS.TOKEN) || '';
  const headers = { 'Content-Type': 'application/json' };
  // InfinityFree يحجب Authorization header — نستخدم X-Token بدلاً منه
  if (tk) headers['X-Token'] = tk;
  // نرسل كلاهما كـ fallback
  if (tk) headers['Authorization'] = 'Bearer ' + tk;
  try {
    const res = await fetch(url, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch(e) { return { ok: false, msg: 'Server error: ' + text.slice(0,120) }; }
  } catch(e) {
    return { ok: false, msg: 'Network error' };
  }
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className='toast'; }, 2800);
}

// ══════════════════════════════════════════
// PRODUCTS
// ══════════════════════════════════════════
const DEMO = [
  {id:1,name_ar:'عود الملكي',name_en:'Royal Oud',brand:'Creed',origin:'France',category:'men',price:450,price_before:550,stock:10,image:'https://images.unsplash.com/photo-1541643600914-78b084683702?w=400&q=80',description_ar:'عطر عود فاخر برائحة خشبية غنية ودافئة',description_en:'Luxurious oud with rich warm woody notes'},
  {id:2,name_ar:'روز دو باريس',name_en:'Rose de Paris',brand:'Chanel',origin:'France',category:'women',price:380,price_before:null,stock:15,image:'https://images.unsplash.com/photo-1588514912908-53a8b1010e6a?w=400&q=80',description_ar:'رائحة وردية ناعمة من باريس',description_en:'Soft floral rose from Paris'},
  {id:3,name_ar:'أوريانتال نايت',name_en:'Oriental Night',brand:'TORO',origin:'UAE',category:'unisex',price:290,price_before:350,stock:8,image:'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400&q=80',description_ar:'عطر شرقي دافئ بالعنبر والمسك',description_en:'Warm oriental blend with amber and musk'},
  {id:4,name_ar:'مسك الخالص',name_en:'Pure Musk',brand:'Lattafa',origin:'UAE',category:'unisex',price:180,price_before:null,stock:20,image:'https://images.unsplash.com/photo-1615634260167-c8cdede054de?w=400&q=80',description_ar:'مسك نقي لأناقة يومية',description_en:'Pure musk for everyday elegance'},
  {id:5,name_ar:'جاسمين دريم',name_en:'Jasmine Dream',brand:'YSL',origin:'France',category:'women',price:520,price_before:600,stock:5,image:'https://images.unsplash.com/photo-1563170351-be82bc888aa4?w=400&q=80',description_ar:'مزيج الياسمين والفانيليا الفاخر',description_en:'Luxurious jasmine and vanilla blend'},
  {id:6,name_ar:'سيدار وود',name_en:'Cedar Wood',brand:'TORO',origin:'UAE',category:'men',price:320,price_before:380,stock:12,image:'https://images.unsplash.com/photo-1587017539504-67cfbddac569?w=400&q=80',description_ar:'عطر خشب الأرز بلمسة شرقية',description_en:'Cedar fragrance with oriental touch'},
];

async function loadProds() {
  const r = await api('GET', `${BASE}/products.php`);
  prods = (r.ok && Array.isArray(r.data) && r.data.length) ? r.data : DEMO;
  renderProds();
}

function setFlt(f, btn) {
  curFlt = f;
  document.querySelectorAll('.flt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderProds();
}
function doSearch() { renderProds(); }

function renderProds() {
  const grid = document.getElementById('pGrid');
  if (!grid) return;
  const q = (document.getElementById('srchIn')?.value||'').toLowerCase().trim();
  let list = prods.filter(p => {
    if (p.is_active === 0 || p.is_active === '0') return false;
    const mc = curFlt==='all' || p.category===curFlt;
    const ms = !q || p.name_ar.toLowerCase().includes(q) || p.name_en.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q);
    return mc && ms;
  });
  if (!list.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty"><div class="ei">🔍</div><p>${lang==='ar'?'لا نتائج':'No results'}</p></div></div>`;
    return;
  }
  grid.innerHTML = list.map((p,i) => {
    const nm   = lang==='ar' ? p.name_ar : p.name_en;
    const disc = p.price_before ? Math.round((1-p.price/p.price_before)*100) : 0;

function waProduct(id, qty=1) {
  const p = prods.find(x=>x.id==id); if(!p) return;
  const nm = lang==='ar' ? p.name_ar : p.name_en;
  const msg = lang==='ar'
    ? `مرحباً 👋\nأريد طلب:\n\n🫙 *${nm}*\n🏷️ الماركة: ${p.brand}\n💰 السعر: ${p.price} ${t('aed')}\n📦 الكمية: ${qty}\n\nالمجموع: ${(p.price*qty).toFixed(2)} ${t('aed')}`
    : `Hello 👋\nI'd like to order:\n\n🫙 *${nm}*\n🏷️ Brand: ${p.brand}\n💰 Price: ${p.price} ${t('aed')}\n📦 Qty: ${qty}\n\nTotal: ${(p.price*qty).toFixed(2)} ${t('aed')}`;
  window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
}

function sendWhatsApp() {
  const cart = getCart();
  if (!cart.length) { toast(t('ec'),'er'); return; }
  const lines = cart.map(c => {
    const p = prods.find(x=>x.id==c.product_id); if(!p) return null;
    const nm = lang==='ar' ? p.name_ar : p.name_en;
    return `🫙 *${nm}* × ${c.qty} = ${(p.price*c.qty).toFixed(0)} ${t('aed')}`;
  }).filter(Boolean);
  const total = calcTotal(cart);
  const addr  = document.getElementById('chkAddr')?.value?.trim() || '';
  const notes = document.getElementById('chkNotes')?.value?.trim() || '';
  let msg = lang==='ar'
    ? `مرحباً TORO 🌟\n\n*طلب جديد:*\n\n${lines.join('\n')}\n\n💰 *الإجمالي: ${total.toFixed(2)} ${t('aed')}*\n🚚 الشحن: مجاني`
    : `Hello TORO 🌟\n\n*New Order:*\n\n${lines.join('\n')}\n\n💰 *Total: ${total.toFixed(2)} ${t('aed')}*\n🚚 Shipping: Free`;
  if (addr)  msg += `\n📍 ${lang==='ar'?'العنوان':'Address'}: ${addr}`;
  if (notes) msg += `\n📝 ${lang==='ar'?'ملاحظات':'Notes'}: ${notes}`;
  window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
}

// CART
// ══════════════════════════════════════════
function getCart() { return JSON.parse(localStorage.getItem(LS.CART)||'[]'); }
function setCart(c) { localStorage.setItem(LS.CART, JSON.stringify(c)); }
function calcTotal(cart) {
  return cart.reduce((s,c)=>{const p=prods.find(x=>x.id==c.product_id);return s+(p?p.price*c.qty:0);},0);
}

function addCart(id, qty=1) {
  const cart = getCart();
  const ex = cart.find(c=>c.product_id==id);
  if (ex) ex.qty += qty; else cart.push({product_id:id, qty});
  setCart(cart);
  updBdg();
  toast(t('aok'), 'ok');
}
function updBdg() {
  const n  = getCart().reduce((s,c)=>s+c.qty,0);
  const el = document.getElementById('cBdg');
  if (el) { el.textContent=n; el.style.display=n?'flex':'none'; }
}
function renderCart() {
  const cart = getCart();
  const el = document.getElementById('cartBody'); if(!el) return;
  if (!cart.length) {
    el.innerHTML = `<div class="empty"><div class="ei">🛒</div><p>${t('ec')}</p></div>`;
    return;
  }
  const rows = cart.map(c=>{
    const p=prods.find(x=>x.id==c.product_id); if(!p) return '';
    const nm=lang==='ar'?p.name_ar:p.name_en;
    return `<div class="citem">
      <div class="cimg">${p.image?`<img src="${p.image}" onerror="this.style.display='none'">`:'🫙'}</div>
      <div class="cinf">
        <div class="cnm">${escHtml(nm)}</div>
        <div class="cpr">${p.price} ${t('aed')}</div>
        <div class="qr">
          <button class="qb" onclick="chgQty(${p.id},-1)">−</button>
          <span class="qv">${c.qty}</span>
          <button class="qb" onclick="chgQty(${p.id},1)">+</button>
          <span style="font-size:11px;color:var(--mu);margin-${lang==='ar'?'right':'left'}:auto">= ${(p.price*c.qty).toFixed(0)} ${t('aed')}</span>
        </div>
      </div>
      <button class="rmb" onclick="rmCart(${p.id})">🗑</button>
    </div>`;
  }).join('');
  const sub = calcTotal(cart);
  el.innerHTML = rows + `<div class="csm">
    <div class="sr"><span>${t('sb')}</span><span>${sub.toFixed(2)} ${t('aed')}</span></div>
    <div class="sr"><span>${t('sh')}</span><span style="color:var(--gr)">${t('fr')}</span></div>
    <div class="sr tot"><span>${t('tot')}</span><span>${sub.toFixed(2)} ${t('aed')}</span></div>
    <div class="cart-btns">
      <button class="btn-g" onclick="goChk()">${t('cht').replace('💳 ','')}</button>
      <button class="btn-wa" onclick="sendWhatsApp()">📱</button>
    </div>
  </div>`;
}
function chgQty(id,d) {
  const cart = getCart();
  const item = cart.find(c=>c.product_id==id); if(!item) return;
  item.qty+=d;
  if (item.qty<=0) { const nc = cart.filter(c=>c.product_id!=id); setCart(nc); }
  else setCart(cart);
  updBdg(); renderCart();
}
function rmCart(id) {
  setCart(getCart().filter(c=>c.product_id!=id));
  updBdg(); renderCart();
}
function goChk() {
  if (!localStorage.getItem(LS.TOKEN)) { toast(t('lr'),'er'); nav('profile'); return; }
  renderChkSumm(); nav('checkout');
}
function renderChkSumm() {
  const sub = calcTotal(getCart());
  const el = document.getElementById('chkSumm'); if(!el) return;
  el.innerHTML = `<div class="csm">
    <div class="sr"><span>${t('sb')}</span><span>${sub.toFixed(2)} ${t('aed')}</span></div>
    <div class="sr"><span>${t('sh')}</span><span style="color:var(--gr)">${t('fr')}</span></div>
    <div class="sr tot"><span>${t('tot')}</span><span>${sub.toFixed(2)} ${t('aed')}</span></div>
  </div>`;
}
async function placeOrder() {
  const tk = localStorage.getItem(LS.TOKEN);
  if (!tk) { toast(t('lr'),'er'); return; }
  const cart = getCart();
  if (!cart.length) { toast(t('ec'),'er'); return; }
  const addr = document.getElementById('chkAddr')?.value?.trim();
  if (!addr) { toast(lang==='ar'?'أدخل العنوان':'Enter address','er'); return; }
  const btn = document.getElementById('placeBtn');
  btn.disabled=true;
  document.getElementById('t-place').textContent='⏳';
  const r = await api('POST', `${BASE}/orders.php`, {
    items: cart,
    address: addr,
    notes: document.getElementById('chkNotes')?.value||''
  });
  btn.disabled=false;
  document.getElementById('t-place').textContent = t('pl');
  if (r.ok) {
    setCart([]);
    updBdg();
    toast(t('ook'),'ok');
    document.getElementById('chkAddr').value='';
    document.getElementById('chkNotes').value='';
    nav('orders');
  } else {
    toast(r.msg||'Error','er');
    // If token invalid, redirect to login
    if (r.msg && r.msg.includes('nauthorized')) { toast(t('lr'),'er'); nav('profile'); }
  }
}

function showReg() {
  document.getElementById('aForm').innerHTML = `

      <input class="fi" id="rPw" type="password" placeholder="••••••••" autocomplete="new-password"></div>
    <button class="btn-g" style="width:100%" onclick="doReg()">${lang==='ar'?'إنشاء الحساب':'Create Account'}</button>`;
}
async function doLogin() {
  const em = document.getElementById('lEm')?.value?.trim();
  const pw = document.getElementById('lPw')?.value;
  if (!em||!pw) { toast(lang==='ar'?'أدخل البريد وكلمة المرور':'Enter email and password','er'); return; }
  const r = await api('POST', `${BASE}/auth.php?action=login`, {email:em, password:pw});
  if (r.ok && r.data?.token) {
    localStorage.setItem(LS.TOKEN, r.data.token);
    localStorage.setItem(LS.USER, JSON.stringify(r.data.user));
    toast((lang==='ar'?'مرحباً ':'Welcome ')+r.data.user.name,'ok');
    renderProfile();
  } else {
    toast(r.msg || (lang==='ar'?'بيانات خاطئة':'Invalid credentials'),'er');
  }
}
async function doReg() {
  const nm = document.getElementById('rNm')?.value?.trim();
  const em = document.getElementById('rEm')?.value?.trim();
  const pw = document.getElementById('rPw')?.value;
  if (!nm||!em||!pw) { toast(lang==='ar'?'أكمل جميع الحقول':'Fill all fields','er'); return; }
  if (pw.length<6) { toast(lang==='ar'?'كلمة المرور 6 أحرف على الأقل':'Min 6 characters','er'); return; }
  const r = await api('POST', `${BASE}/auth.php?action=register`, {name:nm,email:em,password:pw});
  if (r.ok && r.data?.token) {
    localStorage.setItem(LS.TOKEN, r.data.token);
    localStorage.setItem(LS.USER, JSON.stringify(r.data.user));
    toast(lang==='ar'?'✓ تم إنشاء الحساب':'✓ Account created','ok');
    renderProfile();
  } else {
    toast(r.msg||'Error','er');
  }
}
function doLogout() {
  localStorage.removeItem(LS.TOKEN);
  localStorage.removeItem(LS.USER);
  toast(lang==='ar'?'تم تسجيل الخروج':'Logged out');
  renderProfile();
}

    <div class="tw" id="prodTableWrap">
      ${renderProdTable(list)}
    </div>`;
}

function admProdSearch(q) {
  admSearchQ = q.toLowerCase();
  const r = prods.filter(p =>
    p.name_ar.toLowerCase().includes(admSearchQ) ||
    p.name_en.toLowerCase().includes(admSearchQ) ||
    (p.brand||'').toLowerCase().includes(admSearchQ)
  );
  const wrap = document.getElementById('prodTableWrap');
  if (wrap) wrap.innerHTML = renderProdTable(r);
}

function renderProdTable(list) {
  if (!list.length) return `<div class="adm-empty"><div class="ei">📦</div><p>${lang==='ar'?'لا توجد منتجات':'No products found'}</p></div>`;
  const scls = {men:'cat-m',women:'cat-w',unisex:'cat-u'};
  const catLbls = {men:{ar:'رجالي',en:'Men'},women:{ar:'نسائي',en:'Women'},unisex:{ar:'للجنسين',en:'Unisex'}};
  return `<table>
    <thead><tr>
      <th>📷</th>
      <th>${lang==='ar'?'المنتج':'Product'}</th>
      <th>${lang==='ar'?'الماركة':'Brand'}</th>
      <th>${lang==='ar'?'الفئة':'Category'}</th>
      <th>${lang==='ar'?'السعر قبل':'Before'}</th>
      <th>${lang==='ar'?'السعر بعد':'After'}</th>
      <th>${lang==='ar'?'الخصم':'Disc'}</th>
      <th>${lang==='ar'?'المخزون':'Stock'}</th>
      <th>${lang==='ar'?'الحالة':'Status'}</th>
      <th>${lang==='ar'?'إجراء':'Action'}</th>
    </tr></thead>
    <tbody>${list.map(p=>{
      const disc = p.price_before?Math.round((1-p.price/p.price_before)*100):0;
      const nm = lang==='ar'?p.name_ar:p.name_en;
      const catCls = scls[p.category]||'cat-u';
      const catLbl = catLbls[p.category]?.[lang]||p.category;
      const active = p.is_active==1||p.is_active===undefined;
      return `<tr>
        <td><div class="prod-thumb">
          ${p.image?`<img src="${p.image}" onerror="this.style.display='none'">` : '🫙'}
        </div></td>
        <td style="color:var(--tx);max-width:140px">
          <div style="font-weight:500">${escHtml(nm)}</div>
          ${p.origin?`<div style="font-size:10px;color:var(--mu);margin-top:2px">🌍 ${escHtml(p.origin)}</div>`:''}
        </td>
        <td style="color:var(--tx);font-weight:500">${escHtml(p.brand)}</td>
        <td><span class="${catCls}">${catLbl}</span></td>
        <td>${p.price_before?`<span style="text-decoration:line-through;color:var(--mu)">${p.price_before}</span>`:'-'}</td>
        <td style="color:var(--g);font-weight:700">${p.price} <small style="font-weight:400;color:var(--mu)">${t('aed')}</small></td>
        <td>${disc?`<span style="color:var(--re);font-weight:700">-${disc}%</span>`:'-'}</td>
        <td style="${p.stock<=3?'color:var(--re)':''}">${p.stock}</td>
        <td><span class="${active?'badge-on':'badge-off'}">${active?(lang==='ar'?'نشط':'Active'):(lang==='ar'?'مخفي':'Hidden')}</span></td>
        <td><div class="act-row">
          <button class="btn-sm btn-edit" onclick="openPF(${p.id})">✏️</button>
          <button class="btn-sm btn-del" onclick="delProd(${p.id})">🗑</button>
          <button class="btn-sm btn-wa-sm" onclick="waProduct(${p.id})" title="WhatsApp">📱</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

async function loadAdmOrds() {
  const r = await api('GET', `${BASE}/orders.php`);
  const el = document.getElementById('admBody'); if(!el) return;
  if (!r.ok||!Array.isArray(r.data)) {
    el.innerHTML = `<div style="padding:20px;color:var(--mu)">${r.msg||'Error'}</div>`;
    return;
  }
  const sts=['pending','confirmed','shipped','delivered','cancelled'];
  const scls={pending:'sp',confirmed:'sc2',shipped:'ss',delivered:'sd',cancelled:'sx'};
  el.innerHTML = `
    <div class="adm-search">
      <span class="sic">🔍</span>
      <input placeholder="${lang==='ar'?'بحث في الطلبات...':'Search orders...'}" oninput="filterOrdsTable(this.value, ${JSON.stringify(r.data).replace(/"/g,'&quot;')})">
    </div>
    <div id="ordsTableWrap" class="tw">
      ${renderOrdsTable(r.data, sts, scls)}
    </div>`;
}

function filterOrdsTable(q, data) {
  const filtered = data.filter(o =>
    String(o.id).includes(q) ||
    (o.user_name||'').toLowerCase().includes(q.toLowerCase()) ||
    (o.address||'').toLowerCase().includes(q.toLowerCase())
  );
  const wrap = document.getElementById('ordsTableWrap');
  const sts=['pending','confirmed','shipped','delivered','cancelled'];
  const scls={pending:'sp',confirmed:'sc2',shipped:'ss',delivered:'sd',cancelled:'sx'};
  if (wrap) wrap.innerHTML = renderOrdsTable(filtered, sts, scls);
}

function renderOrdsTable(data, sts, scls) {
  if (!data.length) return `<div class="adm-empty"><div class="ei">🧾</div><p>${lang==='ar'?'لا توجد طلبات':'No orders'}</p></div>`;
  return `<table>
    <thead><tr>
      <th>#</th>
      <th>${lang==='ar'?'العميل':'Customer'}</th>
      <th>${lang==='ar'?'الإجمالي':'Total'}</th>
      <th>${lang==='ar'?'الحالة':'Status'}</th>
      <th>${lang==='ar'?'التاريخ':'Date'}</th>
      <th>${lang==='ar'?'تحديث':'Update'}</th>
      <th>${lang==='ar'?'إجراء':'Action'}</th>
    </tr></thead>
    <tbody>${data.map(o=>`<tr>
      <td style="color:var(--g);font-weight:700">#${o.id}</td>
      <td>
        <div style="color:var(--tx);font-weight:500">${escHtml(o.user_name||'-')}</div>
        ${o.email?`<div style="font-size:10px;color:var(--mu)">${escHtml(o.email)}</div>`:''}
      </td>
      <td style="color:var(--g);font-weight:700">${Number(o.total).toFixed(0)} <small style="color:var(--mu);font-weight:400">${t('aed')}</small></td>
      <td><span class="ost ${scls[o.status]||'sp'}">${ts(o.status)}</span></td>
      <td style="white-space:nowrap">${o.created_at?.slice(0,10)||''}</td>
      <td>
        <select class="st-sel" onchange="updOrdSt(${o.id},this.value)">
          ${sts.map(s=>`<option value="${s}"${o.status===s?' selected':''}>${ts(s)}</option>`).join('')}
        </select>
      </td>
      <td><div class="act-row">
        <button class="btn-sm btn-view" onclick='showOrdDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'>${lang==='ar'?'عرض':'View'}</button>
        <button class="btn-sm btn-wa-sm" onclick='waOrderAdmin(${JSON.stringify(o).replace(/'/g,"&#39;")})'>📱</button>
      </div></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function showOrdDetail(o) {
  const scls={pending:'sp',confirmed:'sc2',shipped:'ss',delivered:'sd',cancelled:'sx'};
  const items = (o.items||[]).map(i=>`
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
      <div>
        <div style="font-size:13px;color:var(--tx)">${escHtml(lang==='ar'?i.name_ar:i.name_en)}</div>
        <div style="font-size:11px;color:var(--mu)">${lang==='ar'?'الكمية':'Qty'}: ${i.qty}</div>
      </div>
      <div style="font-size:13px;color:var(--g);font-weight:700">${(i.price*i.qty).toFixed(0)} ${t('aed')}</div>
    </div>`).join('');
  
  document.getElementById('ordDetailTitle').textContent = `${lang==='ar'?'طلب رقم':'Order'} #${o.id}`;
  document.getElementById('ordDetailBody').innerHTML = `
    <div style="margin-bottom:12px">
      <span class="ost ${scls[o.status]||'sp'}">${ts(o.status)}</span>
      <span style="font-size:11px;color:var(--mu);margin-${lang==='ar'?'right':'left'}:8px">${o.created_at?.slice(0,16)||''}</span>
    </div>
    <div style="background:var(--d3);border-radius:var(--r);padding:12px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--mu);margin-bottom:4px">${lang==='ar'?'العميل':'Customer'}</div>
      <div style="font-weight:600">${escHtml(o.user_name||'-')}</div>
      ${o.email?`<div style="font-size:12px;color:var(--mu)">${escHtml(o.email)}</div>`:''}
    </div>
    ${o.address?`<div style="background:var(--d3);border-radius:var(--r);padding:12px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--mu);margin-bottom:4px">📍 ${lang==='ar'?'العنوان':'Address'}</div>
      <div style="font-size:13px">${escHtml(o.address)}</div>
    </div>`:''}
    ${o.notes?`<div style="background:var(--d3);border-radius:var(--r);padding:12px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--mu);margin-bottom:4px">📝 ${lang==='ar'?'ملاحظات':'Notes'}</div>
      <div style="font-size:13px">${escHtml(o.notes)}</div>
    </div>`:''}
    <div style="margin-bottom:12px">${items}</div>
    <div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(201,168,76,.2)">
      <span style="font-size:15px;font-weight:700;color:var(--g)">${lang==='ar'?'الإجمالي':'Total'}</span>
      <span style="font-size:17px;font-weight:800;color:var(--g)">${Number(o.total).toFixed(2)} ${t('aed')}</span>
    </div>
    <button class="btn-wa" style="width:100%;justify-content:center;gap:8px;font-size:14px" onclick='waOrderAdmin(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
      📱 ${lang==='ar'?'تواصل عبر واتساب':'Contact via WhatsApp'}
    </button>`;
  document.getElementById('ordDetailMod').classList.add('open');
}

async function loadAdmUsers() {
  const r = await api('GET', `${BASE}/users.php`);
  const el = document.getElementById('admBody'); if(!el) return;
  if (!r.ok||!Array.isArray(r.data)) { el.innerHTML=`<div style="padding:20px;color:var(--mu)">${r.msg||'Error'}</div>`; return; }
  el.innerHTML = `
    <div class="adm-search">
      <span class="sic">🔍</span>
      <input placeholder="${lang==='ar'?'بحث في العملاء...':'Search customers...'}" oninput="filterUsersTable(this.value, ${JSON.stringify(r.data).replace(/"/g,'&quot;')})">
    </div>
    <div id="usersTableWrap" class="tw">
      ${renderUsersTable(r.data)}
    </div>`;
}

function filterUsersTable(q, data) {
  const filtered = data.filter(u =>
    u.name.toLowerCase().includes(q.toLowerCase()) ||
    u.email.toLowerCase().includes(q.toLowerCase())
  );
  const wrap = document.getElementById('usersTableWrap');
  if (wrap) wrap.innerHTML = renderUsersTable(filtered);
}

function renderUsersTable(data) {
  if (!data.length) return `<div class="adm-empty"><div class="ei">👥</div><p>${lang==='ar'?'لا يوجد مستخدمون':'No users found'}</p></div>`;
  return `<table>
    <thead><tr>
      <th>#</th>
      <th>${lang==='ar'?'الاسم':'Name'}</th>
      <th>${lang==='ar'?'البريد الإلكتروني':'Email'}</th>
      <th>${lang==='ar'?'الدور':'Role'}</th>
      <th>${lang==='ar'?'تاريخ التسجيل':'Joined'}</th>
    </tr></thead>
    <tbody>${data.map(u=>`<tr>
      <td style="color:var(--mu)">${u.id}</td>
      <td>
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:32px;height:32px;border-radius:50%;background:${u.role==='admin'?'var(--g)':'var(--d3)'};color:${u.role==='admin'?'var(--d)':'var(--mu)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">
            ${escHtml(u.name[0].toUpperCase())}
          </div>
          <span style="color:var(--tx);font-weight:${u.role==='admin'?'700':'400'}">${escHtml(u.name)}</span>
        </div>
      </td>
      <td style="color:var(--mu)">${escHtml(u.email)}</td>
      <td><span class="${u.role==='admin'?'badge-on':''}">
        ${u.role==='admin'?(lang==='ar'?'⚙️ مدير':'⚙️ Admin'):(lang==='ar'?'👤 عميل':'👤 Customer')}
      </span></td>
      <td>${u.created_at?.slice(0,10)||''}</td>
    </tr>`).join('')}</tbody>

async function updOrdSt(id, status) {
  const r = await api('PUT', `${BASE}/orders.php?id=${id}`, {status});
  if (r.ok) toast(lang==='ar'?'✓ تم تحديث الحالة':'✓ Status updated','ok');
  else toast(r.msg||'Error','er');
}

function waOrderAdmin(o) {
  const items = (o.items||[]).map(i=>`🫙 ${lang==='ar'?i.name_ar:i.name_en} × ${i.qty} = ${(i.price*i.qty).toFixed(0)} ${t('aed')}`).join('\n');
  const msg = `*${lang==='ar'?'طلب':'Order'} #${o.id}*\n\n${items}\n\n💰 ${lang==='ar'?'الإجمالي':'Total'}: ${Number(o.total).toFixed(0)} ${t('aed')}\n👤 ${o.user_name||''}\n📍 ${o.address||''}`;
  window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Product Form
function openPF(id=null) {
  const p = id ? prods.find(x=>x.id==id) : null;
  document.getElementById('pfTit').textContent = id
    ? (lang==='ar'?'✏️ تعديل المنتج':'✏️ Edit Product')
    : (lang==='ar'?'+ إضافة منتج جديد':'+ Add New Product');
  document.getElementById('f_id').value  = id||'';
  document.getElementById('f_nar').value = p?.name_ar||'';
  document.getElementById('f_nen').value = p?.name_en||'';
  document.getElementById('f_br').value  = p?.brand||'';
  document.getElementById('f_or').value  = p?.origin||'';
  document.getElementById('f_cat').value = p?.category||'men';
  document.getElementById('f_pr').value  = p?.price||'';
  document.getElementById('f_pb').value  = p?.price_before||'';
  document.getElementById('f_st').value  = p?.stock||'';
  document.getElementById('f_im').value  = p?.image||'';
  document.getElementById('f_ac').value  = (p?.is_active===0||p?.is_active==='0')?'0':'1';
  document.getElementById('f_dar').value = p?.description_ar||'';
  document.getElementById('f_den').value = p?.description_en||'';
  prevImg();
  document.getElementById('pfMod').classList.add('open');
}
function prevImg() {
  const url = document.getElementById('f_im')?.value?.trim();
  const el  = document.getElementById('imgPrev');
  el.innerHTML = url
    ? `<img src="${escHtml(url)}" onerror="this.parentElement.innerHTML='<span>رابط غير صحيح</span>'">`
    : '<span>معاينة / Preview</span>';
}
async function saveProd() {
  const id = document.getElementById('f_id').value;
  const data = {
    name_ar:        document.getElementById('f_nar').value.trim(),
    name_en:        document.getElementById('f_nen').value.trim(),
    brand:          document.getElementById('f_br').value.trim(),
    origin:         document.getElementById('f_or').value.trim(),
    category:       document.getElementById('f_cat').value,
    price:          parseFloat(document.getElementById('f_pr').value)||0,
    price_before:   parseFloat(document.getElementById('f_pb').value)||null,
    stock:          parseInt(document.getElementById('f_st').value)||0,
    image:          document.getElementById('f_im').value.trim(),
    description_ar: document.getElementById('f_dar').value,
    description_en: document.getElementById('f_den').value,
    is_active:      parseInt(document.getElementById('f_ac').value)
  };
  if (!data.name_ar||!data.name_en||!data.brand||data.price<=0) {
    toast(lang==='ar'?'الاسم والماركة والسعر مطلوبة':'Name, brand and price required','er');
    return;
  }
  const url = id ? `${BASE}/products.php?id=${id}` : `${BASE}/products.php`;
  const r   = await api(id?'PUT':'POST', url, data);
  if (r.ok) {
    cm('pfMod');
    toast(lang==='ar'?'✓ تم الحفظ':'✓ Saved','ok');
    await loadProds();
    if (admCurrentTab==='products') await loadAdmProds();
  } else {
    toast(r.msg||'Error','er');
  }
}
async function delProd(id) {
  if (!confirm(lang==='ar'?'حذف هذا المنتج نهائياً؟':'Delete this product permanently?')) return;
  const r = await api('DELETE', `${BASE}/products.php?id=${id}`);
  if (r.ok) {
    toast(lang==='ar'?'تم الحذف':'Deleted');
    await loadProds();
    if (admCurrentTab==='products') await loadAdmProds();
  } else toast(r.msg||'Error','er');
}

// ══════════════════════════════════════════
// SECURITY: HTML Escape
// ══════════════════════════════════════════
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function cm(id) { document.getElementById(id)?.classList.remove('open'); }
document.querySelectorAll('.ov').forEach(m => {
  m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); });
});

updBdg();
loadProds();
document.querySelectorAll('[data-ar]').forEach(el => el.textContent = el.getAttribute('data-'+lang));
</script>
