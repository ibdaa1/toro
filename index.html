<!-- HOME -->
<div class="pg on" id="pg-home">
  <div class="hero">
    <div class="h-eye" id="t-eye" data-i18n="eye"></div>
    <div class="h-tit">TORO</div>
    <div class="h-sub" id="t-sub" data-i18n="sub"></div>
    <div class="h-tag" id="t-tag" data-i18n="tag"></div>
  </div>

  <!-- Animated product marquee -->
  <div class="mq-wrap" aria-hidden="true">
    <div class="mq-track" id="mq-track"></div>
  </div>

  <!-- Trust badges -->
  <div class="trust-row">
    <div class="trust-item">
      <span class="trust-ic">🚚</span>
      <span class="trust-ar" data-i18n="trust_ship"></span>
    </div>
    <div class="trust-sep"></div>
    <div class="trust-item">
      <span class="trust-ic">💳</span>
      <span class="trust-ar" data-i18n="trust_cod"></span>
    </div>
    <div class="trust-sep"></div>
    <div class="trust-item">
      <span class="trust-ic">✨</span>
      <span class="trust-ar" data-i18n="trust_auth"></span>
    </div>
  </div>

  <div class="sw">
    <span class="sic">🔍</span>
    <input id="srchIn" data-i18n-ph="sph" oninput="doSearch()">
  </div>
  <div class="flts" id="fltBar">
    <button class="flt on" onclick="setFlt('all',this)" data-i18n="flt_all"></button>
    <button class="flt" onclick="setFlt('men',this)" data-i18n="flt_men"></button>
    <button class="flt" onclick="setFlt('women',this)" data-i18n="flt_wom"></button>
    <button class="flt" onclick="setFlt('unisex',this)" data-i18n="flt_uni"></button>
  </div>
  <div class="pgrd" id="pGrid"><div class="ldw"><div class="ld"></div></div></div>
</div>

<!-- CART -->
<div class="pg" id="pg-cart">
  <div class="ptit" id="t-cart" data-i18n="pg_cart"></div>
  <div id="cartBody"></div>
</div>

<!-- CHECKOUT -->
<div class="pg" id="pg-checkout">
  <div class="ptit" id="t-chk" data-i18n="pg_chk"></div>
  <div class="chkf">
    <div class="notice">💡 <span id="t-chk-note" data-i18n="chk_note"></span></div>
    <div class="fg"><label class="fl" id="t-addr" data-i18n="address_lbl"></label>
      <textarea class="fta" id="chkAddr" data-i18n-ph="address_ph" maxlength="500"></textarea></div>
    <div class="fg"><label class="fl" id="t-notes" data-i18n="notes_lbl"></label>
      <textarea class="fta" id="chkNotes" rows="2" maxlength="300"></textarea></div>
    <div id="chkSumm"></div>
    <div class="chk-acts">
      <button class="btn-g" id="placeBtn" onclick="placeOrder()"><span id="t-place" data-i18n="place_order"></span></button>
    </div>
  </div>
</div>

<!-- ORDERS -->
<div class="pg" id="pg-orders">
  <div class="ptit" id="t-ord" data-i18n="pg_ord"></div>
  <div id="ordBody"></div>
</div>

<!-- FAVORITES -->

  <div class="ptit" id="t-fav" data-i18n="pg_fav"></div>

</div>

<!-- ABOUT -->

</div>

  <div class="ptit">⚙️ <span id="t-dash" data-i18n="pg_dash"></span></div>
  <div id="admContent"></div>
</div>

<!-- BOTTOM NAV -->

  </button>
  <button class="bni" onclick="nav('cart')" id="bn-cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>

  <button class="bni" onclick="nav('profile')" id="bn-profile">

<!-- ══════════ MODALS ══════════ -->

<!-- Product Detail -->
<div class="ov" id="pdMod">
  <div class="modal">
    <div id="pdBody"></div>
    <div class="qty-sel">
      <span class="qty-lbl" id="t-qty" data-i18n="qty_lbl"></span>
      <div class="qty-ctrl">
        <button class="qcb" onclick="chgMQty(-1)">−</button>
        <span class="qcv" id="mQty">1</span>
        <button class="qcb" onclick="chgMQty(1)">+</button>
      </div>
    </div>
    <div class="mac">
      <button class="btn-g" id="pdAddBtn" onclick="addFromModal()" data-i18n="add_cart"></button>
      <button class="btn-wa-mod" onclick="waFromModal()" data-i18n-label="wa_order">📱</button>
      <button class="bcl" onclick="cm('pdMod')" data-i18n-label="close_lbl">✕</button>
    </div>
  </div>
</div>

<!-- Product Form (Admin) -->
<div class="ov" id="pfMod">
  <div class="modal">
    <div class="mt" id="pfTit" data-i18n="adm_new_prod"></div>
    <input type="hidden" id="f_id">
    <div class="fr2">
      <div class="fg"><label class="fl" data-i18n="adm_f_nar"></label><input class="fi" id="f_nar" data-i18n-ph="adm_ph_nar" maxlength="200"></div>
      <div class="fg"><label class="fl" data-i18n="adm_f_nen"></label><input class="fi" id="f_nen" data-i18n-ph="adm_ph_nen" maxlength="200"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl" data-i18n="adm_f_brand"></label><input class="fi" id="f_br" data-i18n-ph="adm_ph_brand" maxlength="100"></div>
      <div class="fg"><label class="fl" data-i18n="adm_f_origin"></label><input class="fi" id="f_or" data-i18n-ph="adm_ph_origin" maxlength="100"></div>
    </div>
    <div class="fg"><label class="fl" data-i18n="adm_f_cat"></label>
      <select class="fsel" id="f_cat">
        <option value="men" data-i18n="cat_men"></option>
        <option value="women" data-i18n="cat_women"></option>
        <option value="unisex" data-i18n="cat_unisex"></option>
      </select>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl" data-i18n="adm_f_price"></label><input class="fi" id="f_pr" type="number" placeholder="299" min="0" max="99999"></div>
      <div class="fg"><label class="fl" data-i18n="adm_f_before"></label><input class="fi" id="f_pb" type="number" placeholder="399" min="0" max="99999"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="fl" data-i18n="adm_f_stock"></label><input class="fi" id="f_st" type="number" placeholder="10" min="0" max="9999"></div>
      <div class="fg"><label class="fl" data-i18n="adm_f_status"></label>
        <select class="fsel" id="f_ac">
          <option value="1" data-i18n="status_on"></option>
          <option value="0" data-i18n="status_off"></option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label class="fl" data-i18n="adm_f_image"></label>
      <input class="fi" id="f_im" data-i18n-ph="adm_ph_image" oninput="prevImg()" maxlength="500">
      <div class="ipr" id="imgPrev"><span data-i18n="preview_lbl"></span></div>
    </div>
    <div class="fg"><label class="fl" data-i18n="adm_f_dar"></label><textarea class="fta" id="f_dar" data-i18n-ph="adm_ph_dar" maxlength="1000"></textarea></div>
    <div class="fg"><label class="fl" data-i18n="adm_f_den"></label><textarea class="fta" id="f_den" data-i18n-ph="adm_ph_den" maxlength="1000"></textarea></div>
    <div class="mac">
      <button class="btn-g" onclick="saveProd()"><span id="t-save" data-i18n="adm_save_prod"></span></button>
      <button class="bcl" onclick="cm('pfMod')" data-i18n="cancel_lbl"></button>
    </div>
  </div>
</div>

<!-- Order Detail Modal (Admin) -->
<div class="ov" id="ordDetailMod">
  <div class="modal">
    <div class="mt" id="ordDetailTitle" data-i18n="ord_detail_title"></div>
    <div id="ordDetailBody"></div>
    <div style="margin-top:14px">
      <button class="bcl" style="width:100%" onclick="cm('ordDetailMod')" data-i18n="close_lbl"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
